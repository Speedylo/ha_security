<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="40" y="40" width="1000" height="680" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="9 5"/>
<text x="52" y="56" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">CGROUP V2 SLICE — bounds by default: 640 MB of memory · 64 processes · 64 MB of private /tmp</text>
<rect x="80" y="90" width="920" height="600" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="9 5"/>
<text x="92" y="106" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">SEVEN NAMESPACES — user · mount · pid · network · ipc · uts · cgroup</text>
<rect x="120" y="140" width="840" height="170" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="9 5"/>
<text x="132" y="156" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">SECCOMP FILTER — a deny-list: kernel modules, ptrace, mount, bpf, unshare, setns … fail with EPERM</text>
<rect x="160" y="190" width="760" height="100" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="540" y="232" font-size="13" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">One Python interpreter: the unmodified integration, inside runtime (B),</text>
<text x="540" y="248" font-size="13" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">with the bridge's sandbox half and the egress shim</text>
<rect x="120" y="340" width="400" height="320" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="132" y="356" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">Filesystem view (mount namespace)</text>
<rect x="140" y="390" width="360" height="42" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="155" y="411" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">The integration's own directory</text>
<text x="485" y="411" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="end" dominant-baseline="middle">read-only</text>
<rect x="140" y="442" width="360" height="42" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="155" y="463" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">/sandbox/data</text>
<text x="485" y="463" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="end" dominant-baseline="middle">writable</text>
<rect x="140" y="494" width="360" height="42" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="155" y="515" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">/tmp</text>
<text x="485" y="515" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="end" dominant-baseline="middle">private, within the slice</text>
<rect x="140" y="546" width="360" height="42" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="155" y="567" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">secrets.yaml</text>
<text x="485" y="567" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="end" dominant-baseline="middle">absent</text>
<rect x="140" y="598" width="360" height="42" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="155" y="619" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">The configuration store (.storage)</text>
<text x="485" y="619" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="end" dominant-baseline="middle">absent</text>
<rect x="560" y="340" width="400" height="140" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="760" y="394" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Network (network namespace)</text>
<text x="760" y="410" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">a loopback interface, with multicast on</text>
<text x="760" y="426" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">loopback only, and no route anywhere</text>
<rect x="560" y="500" width="400" height="160" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="760" y="548" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Identity and processes</text>
<text x="760" y="564" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">(user, pid, ipc, uts, cgroup)</text>
<text x="760" y="580" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">root inside, an unprivileged user outside;</text>
<text x="760" y="596" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">sees one process; no shared memory,</text>
<text x="760" y="612" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">host name or position in the cgroup tree</text>
<rect x="1160" y="200" width="200" height="80" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1260" y="232" font-size="13" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Mediator</text>
<text x="1260" y="248" font-size="13" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">(outside the sandbox)</text>
<path d="M 920,240 L 1160,240" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="1076" y="104" width="197" height="52" fill="#ffffff"/>
<text x="1175" y="114" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the channel: one end of a</text>
<text x="1175" y="130" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Unix socket pair, the only</text>
<text x="1175" y="146" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">descriptor that leaves</text>
<path d="M 1100,158 L 1100,234" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
</svg>
