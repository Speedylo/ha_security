<text x="40" y="1045" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif" dominant-baseline="middle">Integrations are drawn as separate elements because they are separate code. They are not separate processes:</text>
