<text x="106" y="1004" font-size="14.85" fill="#c0392b" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif" dominant-baseline="middle">ABSENT — no enforcement point exists anywhere in the running system</text>
