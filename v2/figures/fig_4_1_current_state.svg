<text x="40" y="1043" font-size="14.18" fill="#666666" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif" dominant-baseline="middle">Integrations are drawn as separate elements because they are separate code. They are not separate processes:</text>
<text x="40" y="1061" font-size="14.18" fill="#666666" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif" dominant-baseline="middle">no boundary exists between the elements inside the box, and nothing in the platform enforces one.</text>
<text x="40" y="1077" font-size="14.18" fill="#666666" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif" dominant-baseline="middle">TB1 and TB2 meet at a single interface today. No component stands between them: the integration calls the</text>
<text x="40" y="1095" font-size="14.18" fill="#666666" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif" dominant-baseline="middle">platform directly, and the gap between those two curves is empty.</text>
