<text x="40" y="1079" font-size="10.5" fill="#666666" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif" dominant-baseline="middle">TB1 and TB2 meet at a single interface today. No component stands between them — the integration calls the</text>
