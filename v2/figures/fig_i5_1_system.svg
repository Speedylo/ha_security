<path d="M 970,470 L 1110,465" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path d="M 970,520 L 1110,645" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="988" y="271" width="104" height="59" fill="#ffffff"/>
<text x="1040" y="282" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">one private</text>
<text x="1040" y="300" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">channel</text>
<text x="1040" y="318" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">each</text>
<rect x="1110" y="860" width="360" height="90" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1290" y="885" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Internet and home network</text>
<text x="1290" y="905" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">reached only through the gatekeeper,</text>
<text x="1290" y="925" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">never from a sandbox directly</text>
<path d="M 950,615 L 1060,615 L 1060,905 L 1110,905" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1008" y="770" width="104" height="41" fill="#ffffff"/>
<text x="1060" y="781" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">permitted</text>
<text x="1060" y="799" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">connections</text>
<text x="750" y="30" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" font-style="italic" text-anchor="middle" dominant-baseline="middle">Only the mediator holds a credential to the house. A sandbox's only way out is its channel,</text>
<text x="750" y="50" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" font-style="italic" text-anchor="middle" dominant-baseline="middle">so nothing inside it can reach the house, the log or the network except through the mediator.</text>
</svg>
