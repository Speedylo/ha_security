<rect x="1130" y="245" width="320" height="80" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1290" y="265" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Minimal Home Assistant (B)</text>
<text x="1290" y="285" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">holding only the devices</text>
<text x="1290" y="305" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the integration declared</text>
