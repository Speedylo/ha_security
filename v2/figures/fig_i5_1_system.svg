<text x="230" y="350" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">devices and</text>
<text x="230" y="370" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">commands</text>
<rect x="90" y="720" width="280" height="64" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230" y="742" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Household</text>
<text x="230" y="762" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">web interface and app</text>
<path d="M 230,720 L 230,520" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="560" y="130" width="440" height="640" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="572" y="149" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">FRAMEWORK — RUNS AS AN ORDINARY USER</text>
<rect x="590" y="170" width="380" height="90" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="195" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Supervisor</text>
<text x="780" y="215" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">builds each sandbox, stops it if needed,</text>
<text x="780" y="235" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">starts it again when the household asks</text>
<rect x="590" y="290" width="380" height="450" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="602" y="309" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">Mediator</text>
<rect x="610" y="330" width="340" height="80" rx="5" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="350" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">The only credential to the house,</text>
<text x="780" y="370" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">as an ordinary (non-administrator)</text>
<text x="780" y="390" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Home Assistant user</text>
<rect x="610" y="430" width="340" height="100" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="460" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">For every request: identify the sender,</text>
<text x="780" y="480" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">check its approved permissions,</text>
<text x="780" y="500" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">record, and only then act</text>
<rect x="610" y="550" width="340" height="80" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="570" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Network gatekeeper</text>
<text x="780" y="590" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">opens each permitted connection</text>
<text x="780" y="610" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">for the integration</text>
<rect x="610" y="650" width="340" height="70" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="675" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Passes device updates and</text>
<text x="780" y="695" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">household commands into a sandbox</text>
