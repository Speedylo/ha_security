<text x="1122" y="389" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">SANDBOX — adaptive lighting</text>
<rect x="1130" y="405" width="320" height="50" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1290" y="430" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Unmodified integration</text>
<rect x="1130" y="465" width="320" height="80" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1290" y="485" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Minimal Home Assistant (B)</text>
<text x="1290" y="505" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">holding only the devices</text>
<text x="1290" y="525" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the integration declared</text>
<rect x="1110" y="590" width="360" height="110" rx="5" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="1290" y="625" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">… one sandbox for each</text>
<text x="1290" y="645" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">community integration;</text>
<text x="1290" y="665" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">none holds a credential</text>
