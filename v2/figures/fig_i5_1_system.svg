<text x="490" y="271" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">devices;</text>
<text x="490" y="289" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">household commands</text>
<path d="M 590,460 L 390,460" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="429" y="410" width="122" height="41" fill="#ffffff"/>
<text x="490" y="421" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">actions,</text>
<text x="490" y="439" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">device states</text>
<rect x="600" y="860" width="300" height="90" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="750" y="885" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Audit log</text>
<text x="750" y="905" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">tamper-evident;</text>
<text x="750" y="925" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">outside every sandbox</text>
<path d="M 750,740 L 750,860" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="685" y="792" width="130" height="41" fill="#ffffff"/>
<text x="750" y="803" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">written before</text>
<text x="750" y="821" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the action</text>
