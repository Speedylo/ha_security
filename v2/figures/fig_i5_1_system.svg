<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="40" y="130" width="380" height="500" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="52" y="149" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">THE HOUSEHOLD'S HOME ASSISTANT (A)</text>
<rect x="70" y="200" width="320" height="120" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230" y="229" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Bridge integration</text>
<text x="230" y="250" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">shows confined devices as</text>
<text x="230" y="270" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">ordinary devices; explains</text>
<text x="230" y="291" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">any stop in Repairs</text>
<rect x="70" y="400" width="320" height="120" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230" y="439" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Home Assistant</text>
<text x="230" y="460" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">devices · actions</text>
<text x="230" y="481" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">users · automations</text>
<path d="M 230,320 L 230,400" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
