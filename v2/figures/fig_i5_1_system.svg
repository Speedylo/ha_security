<text x="1122" y="169" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">SANDBOX — electricity prices</text>
<rect x="1130" y="185" width="320" height="50" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
