<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="860" viewBox="0 0 1560 860">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="30" y="40" width="520" height="810" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="42" y="56" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">INSIDE THE SANDBOX</text>
<rect x="50" y="70" width="200" height="44" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="150" y="92" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Integration</text>
<path d="M 150,114 L 150,820" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="290" y="70" width="200" height="44" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="390" y="92" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Egress shim</text>
<path d="M 390,114 L 390,820" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="590" y="70" width="200" height="44" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="690" y="92" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Mediator: egress broker</text>
<path d="M 690,114 L 690,820" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="840" y="70" width="200" height="44" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="940" y="92" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Resolver (DNS)</text>
<path d="M 940,114 L 940,820" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="1050" y="70" width="200" height="44" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1150" y="92" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Declared host</text>
<path d="M 1150,114 L 1150,820" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<path d="M 150,175 L 390,175" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="189" y="153" width="162" height="19" fill="#ffffff"/>
<text x="270" y="162" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">resolve api.example.com</text>
<path d="M 390,225 L 150,225" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="186" y="188" width="168" height="34" fill="#ffffff"/>
<text x="270" y="198" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">a placeholder from</text>
<text x="270" y="212" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">240.0.0.0/4 (unroutable)</text>
<path d="M 150,290 L 390,290" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="196" y="253" width="149" height="34" fill="#ffffff"/>
<text x="270" y="262" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">connect to the</text>
<text x="270" y="278" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">placeholder, port 443</text>
<path d="M 390,350 L 690,350" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="443" y="313" width="195" height="34" fill="#ffffff"/>
<text x="540" y="322" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">connect api.example.com:443,</text>
<text x="540" y="338" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">on its channel</text>
<rect x="565" y="385.0" width="250" height="50" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="690" y="402" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">1  decide against the network.egress</text>
<text x="690" y="418" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">clauses, and record the decision</text>
<path d="M 690,475 L 940,475" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="747" y="453" width="135" height="19" fill="#ffffff"/>
<text x="815" y="462" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">2  resolve the name</text>
<path d="M 940,520 L 690,520" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="780" y="498" width="69" height="19" fill="#ffffff"/>
<text x="815" y="508" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">addresses</text>
<rect x="565" y="546.0" width="250" height="78" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="690" y="562" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">3  re-check each address: refuse</text>
<text x="690" y="578" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">private, loopback, link-local,</text>
<text x="690" y="592" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">multicast and reserved ones;</text>
<text x="690" y="608" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">a refusal here is recorded too</text>
<path d="M 690,670 L 1150,670" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="832" y="633" width="175" height="34" fill="#ffffff"/>
<text x="920" y="642" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">4  connect to exactly the</text>
<text x="920" y="658" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">address just checked</text>
<path d="M 690,730 L 390,730" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="456" y="693" width="168" height="34" fill="#ffffff"/>
<text x="540" y="702" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">5  the connected socket,</text>
<text x="540" y="718" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">passed over the channel</text>
<path d="M 390,775 L 150,775" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="173" y="753" width="195" height="19" fill="#ffffff"/>
<text x="270" y="762" font-size="11" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">an ordinary connected socket</text>
<rect x="1260" y="150" width="270" height="330" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1272" y="166" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">IF THE NAME REBINDS</text>
<text x="1395" y="240" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">The name was granted, but</text>
<text x="1395" y="256" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">now resolves to 192.168.1.1,</text>
<text x="1395" y="272" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">a device in the house.</text>
<text x="1395" y="288" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle"></text>
<text x="1395" y="304" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Step 3 refuses that address,</text>
<text x="1395" y="320" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">and no connection is made.</text>
<text x="1395" y="336" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle"></text>
<text x="1395" y="352" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Nothing passes between the</text>
<text x="1395" y="368" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">check and the connect, and</text>
<text x="1395" y="384" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the sandbox never holds a</text>
<text x="1395" y="400" font-size="12" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">routable address.</text>
</svg>
