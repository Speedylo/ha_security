<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="860" viewBox="0 0 1560 860">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="30" y="20" width="520" height="830" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="42" y="41" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">INSIDE THE SANDBOX</text>
<rect x="50" y="70" width="200" height="44" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="150" y="92" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Integration</text>
<path d="M 150,114 L 150,820" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="290" y="70" width="200" height="44" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="390" y="92" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Egress shim</text>
<path d="M 390,114 L 390,820" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="590" y="70" width="200" height="44" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="690" y="92" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Egress broker</text>
<path d="M 690,114 L 690,820" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="840" y="70" width="200" height="44" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="940" y="92" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Resolver (DNS)</text>
<path d="M 940,114 L 940,820" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="1050" y="70" width="200" height="44" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1150" y="92" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Declared host</text>
<path d="M 1150,114 L 1150,820" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<path d="M 150,175 L 390,175" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="167" y="142" width="206" height="24" fill="#ffffff"/>
<text x="270" y="155" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">resolve api.example.com</text>
<path d="M 390,240 L 150,240" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="168" y="187" width="203" height="45" fill="#ffffff"/>
<text x="270" y="199" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">a placeholder from</text>
<text x="270" y="220" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">240.0.0.0/4 (unroutable)</text>
<path d="M 150,305 L 390,305" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="176" y="252" width="188" height="45" fill="#ffffff"/>
<text x="270" y="264" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">connect to the</text>
<text x="270" y="285" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">placeholder, port 443</text>
<path d="M 390,365 L 690,365" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="418" y="312" width="243" height="45" fill="#ffffff"/>
<text x="540" y="324" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">connect api.example.com:443,</text>
<text x="540" y="345" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">on its channel</text>
<rect x="555" y="381.0" width="270" height="58" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="690" y="400" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">1  decide against the</text>
<text x="690" y="420" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">egress clauses; record it</text>
<path d="M 690,475 L 940,475" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="732" y="442" width="166" height="24" fill="#ffffff"/>
<text x="815" y="455" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">2  resolve the name</text>
<path d="M 940,520 L 690,520" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="769" y="488" width="92" height="24" fill="#ffffff"/>
<text x="815" y="500" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">addresses</text>
<rect x="555" y="530.0" width="270" height="96" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="690" y="547" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">3  re-check each address;</text>
<text x="690" y="568" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">refuse private, loopback,</text>
<text x="690" y="588" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">link-local and reserved</text>
<text x="690" y="609" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">ones, and record it</text>
<path d="M 690,682 L 1150,682" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="812" y="629" width="216" height="45" fill="#ffffff"/>
<text x="920" y="641" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">4  connect to exactly the</text>
<text x="920" y="662" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">address just checked</text>
<path d="M 690,742 L 390,742" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="436" y="689" width="207" height="45" fill="#ffffff"/>
<text x="540" y="701" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">5  the connected socket,</text>
<text x="540" y="722" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">passed over the channel</text>
<path d="M 390,787 L 150,787" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="144" y="754" width="252" height="24" fill="#ffffff"/>
<text x="270" y="767" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">an ordinary connected socket</text>
<rect x="1260" y="150" width="270" height="330" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1272" y="171" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">IF THE NAME REBINDS</text>
<text x="1395" y="210" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">The name was granted, but</text>
<text x="1395" y="232" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">now resolves to 192.168.1.1,</text>
<text x="1395" y="254" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">a device in the house.</text>
<text x="1395" y="276" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle"></text>
<text x="1395" y="298" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Step 3 refuses that address,</text>
<text x="1395" y="320" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">and no connection is made.</text>
<text x="1395" y="342" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle"></text>
<text x="1395" y="364" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Nothing passes between the</text>
<text x="1395" y="386" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">check and the connect, and</text>
<text x="1395" y="408" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the sandbox never holds a</text>
<text x="1395" y="430" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">routable address.</text>
</svg>
