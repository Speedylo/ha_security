<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="30" y="40" width="640" height="1220" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="42" y="59" font-size="15.6" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">INSIDE THE SANDBOX</text>
<rect x="40" y="76" width="200" height="44" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="140" y="98" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Integration</text>
<path d="M 140,120 L 140,1240" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="250" y="76" width="200" height="44" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="350" y="98" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Minimal copy (B)</text>
<path d="M 350,120 L 350,1240" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="460" y="76" width="200" height="44" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="560" y="98" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Bridge (sandbox side)</text>
<path d="M 560,120 L 560,1240" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="720" y="76" width="200" height="44" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820" y="98" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Mediator</text>
<path d="M 820,120 L 820,1240" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="960" y="76" width="200" height="44" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1060" y="98" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Audit log</text>
<path d="M 1060,120 L 1060,1240" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="1180" y="76" width="200" height="44" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1280" y="98" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Home Assistant (A)</text>
<path d="M 1280,120 L 1280,1240" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6 4"/>
<path d="M 30,140 L 1370,140" fill="none" stroke="#1a1a1a" stroke-width="1"/>
<text x="40" y="158" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">THE INTEGRATION SWITCHES ON A LIGHT</text>
<path d="M 140,220 L 350,220" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="120" y="176" width="250" height="41" fill="#ffffff"/>
<text x="245" y="188" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">switch on the light, exactly</text>
<text x="245" y="206" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">as it would unconfined</text>
<path d="M 350,275 L 560,275" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="377" y="231" width="156" height="41" fill="#ffffff"/>
<text x="455" y="243" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">not handled here:</text>
<text x="455" y="261" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">pass it on</text>
<path d="M 560,335 L 820,335" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="591" y="291" width="199" height="41" fill="#ffffff"/>
<text x="690" y="303" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the request, sent down</text>
<text x="690" y="321" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">its private channel</text>
<rect x="682" y="367.0" width="276" height="46" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820" y="381" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">1  identify: by the channel it came</text>
<text x="820" y="399" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">on, never by what it claims</text>
<rect x="682" y="422.0" width="276" height="46" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820" y="445" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">2  look up its approved permissions</text>
<rect x="682" y="477.0" width="276" height="46" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820" y="491" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">3  decide: allow or refuse, naming</text>
<text x="820" y="509" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the permission that decided</text>
<path d="M 820,580 L 1060,580" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="841" y="536" width="199" height="41" fill="#ffffff"/>
<text x="940" y="548" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">4  record the decision</text>
<text x="940" y="566" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">on disk</text>
<path d="M 820,640 L 1280,640" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="921" y="596" width="259" height="41" fill="#ffffff"/>
<text x="1050" y="608" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">5  carry out the action, with</text>
<text x="1050" y="626" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the mediator's credential</text>
<path d="M 1280,685 L 820,685" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="1019" y="660" width="61" height="22" fill="#ffffff"/>
<text x="1050" y="671" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">result</text>
<path d="M 820,735 L 560,735" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="522" y="710" width="336" height="22" fill="#ffffff"/>
<text x="690" y="721" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">answer, naming the deciding permission</text>
<path d="M 560,780 L 140,780" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="152" y="755" width="396" height="22" fill="#ffffff"/>
<text x="350" y="766" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the call succeeds, or fails if it was refused</text>
<rect x="1066" y="431" width="207" height="77" fill="#ffffff"/>
<text x="1170" y="443" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">a refused request skips</text>
<text x="1170" y="461" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">step 5: it is recorded</text>
<text x="1170" y="479" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">and answered, and</text>
<text x="1170" y="497" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">nothing is done</text>
<path d="M 30,810 L 1370,810" fill="none" stroke="#1a1a1a" stroke-width="1"/>
<text x="40" y="828" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">A DEVICE THE INTEGRATION FOLLOWS CHANGES IN (A)</text>
<path d="M 1280,870 L 820,870" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="951" y="845" width="199" height="22" fill="#ffffff"/>
<text x="1050" y="856" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the device's new state</text>
<path d="M 820,930 L 560,930" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="526" y="886" width="327" height="41" fill="#ffffff"/>
<text x="690" y="898" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">sent to each sandbox that follows it;</text>
<text x="690" y="916" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">not recorded every time</text>
<path d="M 560,990 L 350,990" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="347" y="965" width="216" height="22" fill="#ffffff"/>
<text x="455" y="976" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">update the device in (B)</text>
<rect x="1079" y="931" width="182" height="59" fill="#ffffff"/>
<text x="1170" y="942" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">recorded once, when</text>
<text x="1170" y="960" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">following the device</text>
<text x="1170" y="978" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">was allowed</text>
<path d="M 30,1030 L 1370,1030" fill="none" stroke="#1a1a1a" stroke-width="1"/>
<text x="40" y="1048" font-size="16.9" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">THE HOUSEHOLD USES A DEVICE THE INTEGRATION PROVIDES</text>
<path d="M 1280,1080 L 820,1080" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="942" y="1036" width="216" height="41" fill="#ffffff"/>
<text x="1050" y="1048" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">command, from the bridge</text>
<text x="1050" y="1066" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">in (A)</text>
<path d="M 820,1130 L 1060,1130" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="896" y="1105" width="87" height="22" fill="#ffffff"/>
<text x="940" y="1116" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">record it</text>
<path d="M 820,1180 L 560,1180" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="586" y="1155" width="207" height="22" fill="#ffffff"/>
<text x="690" y="1166" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">pass it to that sandbox</text>
<path d="M 560,1225 L 140,1225" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="233" y="1200" width="233" height="22" fill="#ffffff"/>
<text x="350" y="1211" font-size="14.3" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the integration handles it</text>
</svg>
