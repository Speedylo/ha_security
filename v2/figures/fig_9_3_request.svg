<text x="40" y="158" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">A SERVICE CALL FROM THE INTEGRATION</text>
<path d="M 140,220 L 350,220" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="121" y="178" width="248" height="45" fill="#ffffff"/>
<text x="245" y="190" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">light.turn_on, as it</text>
<text x="245" y="210" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">would call it unconfined</text>
<path d="M 350,275 L 560,275" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="346" y="232" width="218" height="45" fill="#ffffff"/>
<text x="455" y="245" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">not a service of (B):</text>
<text x="455" y="265" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">forward it</text>
