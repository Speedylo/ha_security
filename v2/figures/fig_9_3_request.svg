<rect x="137" y="175" width="215" height="45" fill="#ffffff"/>
<text x="245" y="187" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">light.turn_on, as it</text>
<text x="245" y="208" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">would call it unconfined</text>
