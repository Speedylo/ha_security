<text x="690" y="304" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">service.call frame on its channel</text>
<text x="690" y="325" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">(four-byte length, then JSON)</text>
<rect x="685" y="358.0" width="270" height="54" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820" y="375" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">1  identity: from the channel,</text>
<text x="820" y="395" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">never from the frame</text>
<rect x="685" y="418.0" width="270" height="54" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820" y="435" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">2  the manifest bound</text>
<text x="820" y="455" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">to that identity</text>
<rect x="685" y="478.0" width="270" height="54" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820" y="495" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">3  permit or deny, naming</text>
<text x="820" y="515" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the deciding clause</text>
<path d="M 820,590 L 1060,590" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="841" y="537" width="198" height="45" fill="#ffffff"/>
<text x="940" y="549" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">4  record the decision,</text>
<text x="940" y="570" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">flushed to disk</text>
