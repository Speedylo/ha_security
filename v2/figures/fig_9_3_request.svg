<text x="940" y="1118" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">record it</text>
<path d="M 820,1180 L 560,1180" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
