<text x="1050" y="858" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the entity's new state</text>
<path d="M 820,930 L 560,930" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="502" y="888" width="376" height="45" fill="#ffffff"/>
<text x="690" y="900" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">push to each sandbox that subscribed;</text>
<text x="690" y="920" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">nothing recorded per delivery</text>
<path d="M 560,990 L 350,990" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="351" y="965" width="208" height="24" fill="#ffffff"/>
<text x="455" y="978" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">set the state in (B)</text>
<rect x="1071" y="927" width="198" height="66" fill="#ffffff"/>
<text x="1170" y="940" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">recorded once, when</text>
<text x="1170" y="960" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the subscription</text>
<text x="1170" y="980" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">was decided</text>
<path d="M 30,1030 L 1370,1030" fill="none" stroke="#1a1a1a" stroke-width="1"/>
<text x="40" y="1048" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">THE HOUSEHOLD OPERATES A CONFINED ENTITY</text>
