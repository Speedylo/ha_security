<rect x="527" y="710" width="327" height="24" fill="#ffffff"/>
<text x="690" y="722" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">answer, with the deciding clause</text>
<path d="M 560,780 L 140,780" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="127" y="755" width="446" height="24" fill="#ffffff"/>
<text x="350" y="768" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the call returns, or raises if it was denied</text>
<rect x="1056" y="427" width="228" height="86" fill="#ffffff"/>
<text x="1170" y="439" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">a denied call skips</text>
<text x="1170" y="460" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">step 5: it is recorded</text>
<text x="1170" y="480" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">and answered, and</text>
<text x="1170" y="501" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">nothing is performed</text>
