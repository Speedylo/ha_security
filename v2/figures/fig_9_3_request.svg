<text x="40" y="1048" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">THE HOUSEHOLD OPERATES A CONFINED ENTITY</text>
