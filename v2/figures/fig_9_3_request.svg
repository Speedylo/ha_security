<rect x="921" y="598" width="258" height="45" fill="#ffffff"/>
<text x="1050" y="610" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">5  perform the call,</text>
<text x="1050" y="630" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">with the mediator's token</text>
<path d="M 1280,685 L 820,685" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="1015" y="660" width="69" height="24" fill="#ffffff"/>
<text x="1050" y="672" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">result</text>
