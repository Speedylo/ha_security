<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="40" y="130" width="380" height="500" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="52" y="151" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">HOME ASSISTANT (A)</text>
<rect x="70" y="200" width="320" height="120" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230" y="225" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Bridge integration</text>
<text x="230" y="248" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">publishes confined entities</text>
<text x="230" y="272" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">as real ones; raises Repairs</text>
<text x="230" y="295" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">issues after a cut-off</text>
<rect x="70" y="400" width="320" height="120" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230" y="436" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Platform core</text>
<text x="230" y="460" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">states · services · devices</text>
<text x="230" y="484" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">users · automations</text>
<path d="M 230,320 L 230,400" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="160" y="336" width="140" height="48" fill="#ffffff"/>
<text x="230" y="349" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">entities and</text>
<text x="230" y="371" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">commands</text>
<rect x="90" y="720" width="280" height="64" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230" y="740" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Household</text>
<text x="230" y="764" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">web interface and app</text>
<path d="M 230,720 L 230,520" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="560" y="130" width="440" height="640" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="572" y="151" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">FRAMEWORK: UNPRIVILEGED PROCESS</text>
<rect x="590" y="170" width="380" height="90" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="193" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Supervisor: builds each sandbox,</text>
<text x="780" y="215" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">kills it after a cut-off, starts it</text>
<text x="780" y="237" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">again when the household asks</text>
<rect x="590" y="290" width="380" height="450" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="602" y="312" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">Mediator</text>
<rect x="610" y="330" width="340" height="80" rx="5" fill="#c8c8c8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="350" font-size="16.245" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">(A)'s access token, as the non-admin</text>
<text x="780" y="370" font-size="16.245" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Home Assistant user confine-mediator:</text>
<text x="780" y="390" font-size="16.245" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the only credential to the house</text>
<rect x="610" y="430" width="340" height="100" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="447" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">For every request: identify</text>
<text x="780" y="469" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the sender by its channel,</text>
<text x="780" y="491" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">decide against the manifest,</text>
<text x="780" y="513" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">record, and only then act</text>
<rect x="610" y="550" width="340" height="80" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="568" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Egress broker</text>
<text x="780" y="590" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">opens each permitted connection</text>
<text x="780" y="612" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">and hands it over</text>
<rect x="610" y="650" width="340" height="70" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="780" y="674" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Push and command relay</text>
<text x="780" y="696" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">from (A) into a sandbox</text>
<path d="M 590,310 L 390,310" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="396" y="258" width="188" height="45" fill="#ffffff"/>
<text x="490" y="270" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">publication;</text>
<text x="490" y="290" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">household commands</text>
<path d="M 590,460 L 390,460" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="416" y="408" width="149" height="45" fill="#ffffff"/>
<text x="490" y="420" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">service calls,</text>
<text x="490" y="440" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">state reads</text>
<rect x="600" y="860" width="300" height="90" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="750" y="883" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Durable audit log</text>
<text x="750" y="905" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">hash- and MAC-chained;</text>
<text x="750" y="927" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">outside every sandbox</text>
<path d="M 750,740 L 750,860" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="676" y="790" width="149" height="45" fill="#ffffff"/>
<text x="750" y="802" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">written before</text>
<text x="750" y="822" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">the act</text>
<rect x="1110" y="150" width="360" height="190" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="1122" y="171" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">SANDBOX — nordpool</text>
<rect x="1130" y="185" width="320" height="50" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1290" y="210" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Unmodified integration</text>
<rect x="1130" y="245" width="320" height="80" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1290" y="263" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Runtime (B), a minimal</text>
<text x="1290" y="285" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Home Assistant holding</text>
<text x="1290" y="307" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">only declared entities</text>
<rect x="1110" y="370" width="360" height="190" rx="5" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="1122" y="391" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="bold" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle">SANDBOX — adaptive_lighting</text>
<rect x="1130" y="405" width="320" height="50" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1290" y="430" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Unmodified integration</text>
<rect x="1130" y="465" width="320" height="80" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1290" y="483" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Runtime (B), a minimal</text>
<text x="1290" y="505" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Home Assistant holding</text>
<text x="1290" y="527" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">only declared entities</text>
<rect x="1110" y="590" width="360" height="110" rx="5" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="9 5"/>
<text x="1290" y="623" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">… one sandbox for each</text>
<text x="1290" y="645" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">community integration;</text>
<text x="1290" y="667" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">no token to (A) in any of them</text>
<path d="M 970,370 L 1110,245" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path d="M 970,470 L 1110,465" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path d="M 970,520 L 1110,645" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="976" y="267" width="129" height="66" fill="#ffffff"/>
<text x="1040" y="280" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">one channel</text>
<text x="1040" y="300" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">each: a Unix</text>
<text x="1040" y="320" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">socket pair</text>
<rect x="1110" y="860" width="360" height="90" rx="5" fill="#e2e2e2" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1290" y="883" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">Internet and home network</text>
<text x="1290" y="905" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">reached only through the broker,</text>
<text x="1290" y="927" font-size="18" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">never from a sandbox directly</text>
<path d="M 950,615 L 1060,615 L 1060,905 L 1110,905" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="1001" y="768" width="119" height="45" fill="#ffffff"/>
<text x="1060" y="780" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">permitted</text>
<text x="1060" y="800" font-size="16.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">connections</text>
<text x="750" y="28" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" font-style="italic" text-anchor="middle" dominant-baseline="middle">Only the mediator holds a credential to the house. Each sandbox's only route out is its channel,</text>
<text x="750" y="52" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" font-style="italic" text-anchor="middle" dominant-baseline="middle">and nothing in a sandbox can reach (A), the log or the network except through the mediator.</text>
</svg>
