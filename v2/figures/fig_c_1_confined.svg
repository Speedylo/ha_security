<text x="850" y="30" font-size="19.5" font-family="Helvetica,Arial,sans-serif" font-weight="normal" fill="#1a1a1a" font-style="italic" text-anchor="middle" dominant-baseline="middle">Each integration is its own process and reaches the house only through the mediator, which records every decision.</text>
