# Security contract for andrews_arnold_quota.
#
# Written by hand here. In the real framework this ships with the integration
# and the supervisor refuses to start one without it. Everything absent from
# this file is denied by default — the integration declares what it needs, and
# gets nothing else.
name: andrews_arnold_quota
version: "2.0.0"

# Entities this integration may create and update.
publishes:
  - sensor.andrews_arnold_*

# Entities elsewhere in the house it may read. A broadband quota sensor has no
# business reading anything, so: nothing. This is what closes the firehose leak
# in /api/states and in subscribe_events.
reads_entities: []

# Services it may call. A confused-deputy attack needs an entry here to succeed;
# there is none, so a token it never holds could not be misused anyway.
calls_services: []

# Event types it may subscribe to.
subscribes: []

# Hosts it may reach. Declared by the integration author, checked per request.
network:
  - chaos2.aa.net.uk
